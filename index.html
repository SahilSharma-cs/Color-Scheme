<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Scheme Generator</title>
    <link rel="stylesheet" href="index.css"/>
</head>
<body>
    <header>
        <input type="color"
                id ="color-input"
                value="#f55a5A"
        />
        <select id="my-drop-down" class="dropdown">
            <option value="monochrome">monochrome</option>
            <option>monochrome-dark</option>
            <option>monochrome-light</option>
            <option>analogic</option>
            <option>complement</option>
            <option>analogic-complement</option>
            <option>triad</option>
        </select>
        <button id="get-hex">Get color Scheme</button>
    </header>
    <div id="scheme-container" class="scheme-container">
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
